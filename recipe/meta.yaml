{% set name = "connectome-workbench" %}
{% set version = "2.2.1" %}
{% set build = 101 %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://github.com/Washington-University/workbench/archive/v{{ version }}.tar.gz
  sha256: e8c4c1d76df7dc657840c3a9756d83a418cdcd03037d4054819249d72f0d8477
  patches:
    # https://github.com/Washington-University/workbench/pull/88
    - patches/0001-chore-build-Find-QuaZip-library.patch

build:
  number: {{ build }}
  skip: true  # [osx or win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    # cmake max: https://github.com/Washington-University/workbench/blob/1b9221db6d9ead4f6337a1981ab419ea3de55031/src/CMakeLists.txt#L4
    - cmake >=3.5,<4.0
    - ninja
    - pkg-config
    - qwt
    # OpenMP
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    # libGL
    - libgl-devel                    # [linux]
    - libglx-devel                   # [linux]
  host:
    - qt6-main >6
    - glib                           # [linux]
    - openssl
    - libzlib =1.3
    - zlib
    - quazip                         # [linux]
    - freetype
    - libglu                         # [linux]
    - glew                           # [windows]
    - mesalib                        # [linux]

test:
  commands:
    - wb_view -help
    - wb_command -version
    - wb_shortcuts -help

outputs:
  - name: {{ name }}-gui
    # build/host requirements should exactly match the root requirements
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        # cmake max: https://github.com/Washington-University/workbench/blob/1b9221db6d9ead4f6337a1981ab419ea3de55031/src/CMakeLists.txt#L4
        - cmake >=3.5,<4.0
        - ninja
        - pkg-config
        - qwt
        # OpenMP
        - llvm-openmp  # [osx]
        - libgomp      # [linux]
        # libGL
        - libgl-devel                    # [linux]
        - libglx-devel                   # [linux]
      host:
        - qt6-main >6
        - openssl
        - glib                           # [linux]
        - libzlib =1.3
        - zlib
        - quazip                         # [linux]
        - freetype
        - libglu                         # [linux]
        - glew                           # [windows]
        - mesalib                        # [linux]
      run:
        - libgl                          # [linux]
        - libglu                         # [linux]
        - mesalib                        # [linux]
        - quazip                         # [linux]
    files:
      include:
        - bin/wb_view
    test:
      commands:
        - wb_view -help
  - name: {{ name }}-cli
    # build/host requirements should exactly match the root requirements
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        # cmake max: https://github.com/Washington-University/workbench/blob/1b9221db6d9ead4f6337a1981ab419ea3de55031/src/CMakeLists.txt#L4
        - cmake >=3.5,<4.0
        - ninja
        - pkg-config
        - qwt
        # OpenMP
        - llvm-openmp  # [osx]
        - libgomp      # [linux]
        # libGL
        - libgl-devel                    # [linux]
        - libglx-devel                   # [linux]
      host:
        - qt6-main >6
        - openssl
        - glib                           # [linux]
        - libzlib =1.3
        - zlib
        - quazip                         # [linux]
        - freetype
        - libglu                         # [linux]
        - glew                           # [windows]
        - mesalib                        # [linux]
      run:
        - libgl                          # [linux]
        - libglu                         # [linux]
        - mesalib                        # [linux]
        - quazip                         # [linux]
    files:
      include:
        - bin/wb_command
        - bin/wb_shortcuts
        - share/bash-completion/completions/*
    test:
      commands:
        - wb_command -version
        - wb_shortcuts -help
  - name: {{ name }}
    requirements:
      run:
        - {{ pin_subpackage('connectome-workbench-cli', exact=True) }}
        - {{ pin_subpackage('connectome-workbench-gui', exact=True) }}
    test:
      commands:
        - wb_view -help
        - wb_command -version
        - wb_shortcuts -help

about:
  home: https://www.humanconnectome.org/software/connectome-workbench
  summary: 'Neuroimaging utility for the Human Connectome Project'
  description: |
    Connectome Workbench is an open source, freely available visualization and discovery
    tool used to map neuroimaging data, especially data generated by the Human
    Connectome Project.
  license: GPL-2.0-only
  license_family: GPL
  license_file:
    - LICENSE
    - src/CZIlib/LICENSE
    - src/QxtCore/LICENSE_qxt
    - src/kloewe/cpuinfo/LICENSE
    - src/kloewe/dot/LICENSE
  doc_url: https://humanconnectome.org/software/workbench-command
  dev_url: https://github.com/Washington-University/workbench

extra:
  recipe-maintainers:
    - coalsont
    - effigies
